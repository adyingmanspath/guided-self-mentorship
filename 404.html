<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting | Guided Self-Mentorship</title>
  <script>
    (() => {
      const redirects = {
        '/about': '/#about',
        '/contact': '/#pricing',
        '/costs': '/#pricing',
        '/donate': '/#pricing',
        '/faqs': '/#faq',
        '/graduation-stories': '/#proof',
        '/how-it-works': '/#method',
        '/the-selfmentorship-blog': '/'
      };
      const path = window.location.pathname.replace(/\/$/, '') || '/';
      const target = redirects[path] || (path.startsWith('/the-selfmentorship-blog/') ? '/' : '/');
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>This page has moved. <a href="/">Continue to Guided Self-Mentorship</a>.</p>
</body>
</html>
